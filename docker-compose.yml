services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libris}
      POSTGRES_USER: ${POSTGRES_USER:-libris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libris_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - libris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libris} -d ${POSTGRES_DB:-libris}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-libris}:${POSTGRES_PASSWORD:-libris_dev_only}@db:5432/${POSTGRES_DB:-libris}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      SQL_ECHO: ${SQL_ECHO:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  libris_postgres_data:
