name: Validar Libris

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de execução
        run: python -m pip install --upgrade pip && python -m pip install "customtkinter>=5.2.2" "Flask>=3.0,<4" "qrcode[pil]>=7.4" "waitress>=3.0"
      - name: Validar sintaxe
        run: python -m py_compile app.py tests/smoke_migration.py
      - name: Testar migração e cópias múltiplas
        run: python tests/smoke_migration.py
